# Firebase App Hosting: builds and serves the Next.js app (backend "hgprofitoptions", us-central1).
# Rollouts start when main changes. Plain values below are not secret; secrets live in Cloud Secret
# Manager and are referenced by name (see docs/deploy.md). An optional integration whose secret is
# set to "none" stays off.
runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  minInstances: 0
  maxInstances: 10

env:
  # Firebase web app (public configuration; the API key is kept out of git as a secret).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_WEB_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: hgprofitoptions-hybertec.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: hgprofitoptions-hybertec
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: hgprofitoptions-hybertec.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "785230671466"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:785230671466:web:22b3aae71d94bcbdae6413
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-RJJP8TQ44T
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://hgprofitoptions.web.app
    availability: [BUILD, RUNTIME]

  # Server actions stay valid across instances and rollouts.
  - variable: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    secret: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    availability: [BUILD, RUNTIME]

  # Optional integrations (shared with the Cloud Functions). "none" turns one off.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: EMAIL_FROM
    value: none
  - variable: SNAPTRADE_CLIENT_ID
    value: none
  - variable: SNAPTRADE_CONSUMER_KEY
    secret: SNAPTRADE_CONSUMER_KEY
  - variable: SNAPTRADE_ENCRYPTION_KEY
    secret: SNAPTRADE_ENCRYPTION_KEY
  - variable: MARKET_DATA_API_KEY
    secret: MARKET_DATA_API_KEY
  - variable: MARKET_DATA_BASE_URL
    value: https://api.polygon.io
