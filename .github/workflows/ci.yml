name: CI

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" on main checks and deploys main again, for example after a failed deploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels a branch's checks, but a run on main always finishes, so a deploy never stops halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:functions

  emulators:
    name: Security rules and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:emulators

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Uses the Google Chrome already installed on the runner (Playwright channel "chrome").
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Every change that reaches main (a merged pull request) goes live once all checks pass. Google Cloud
  # trusts only this job, on main, in the production environment (docs/deploy.md, "Automatic deploys").
  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: [checks, emulators, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      # The site's address comes from apphosting.yaml, the one place it is set.
      url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Site address
        id: site
        run: |
          echo "url=$(awk '/variable: NEXT_PUBLIC_SITE_URL/ { getline; print $2 }' apphosting.yaml)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@v3
        with:
          project_id: hgprofitoptions-hybertec
          workload_identity_provider: projects/785230671466/locations/global/workloadIdentityPools/github/providers/hgprofitoptions
          service_account: github-deployer@hgprofitoptions-hybertec.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Security rules and indexes
        run: pnpm exec firebase deploy --only firestore,storage --project hgprofitoptions-hybertec --non-interactive
      - name: Cloud Functions
        run: pnpm deploy:functions
      - name: App
        run: pnpm deploy:web
      - name: Hosting
        run: pnpm exec firebase deploy --only hosting --project hgprofitoptions-hybertec --non-interactive
